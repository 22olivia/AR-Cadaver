<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no" />

  <title>AR Cadaver Visualization</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
    }

    #info {
      position: fixed;
      top: 12px;
      left: 10px;
      right: 10px;
      z-index: 5;
      padding: 12px;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      pointer-events: none;
    }

    #controls {
      position: fixed;
      bottom: 82px;
      left: 8px;
      right: 8px;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    #controls button {
      min-width: 0;
      padding: 12px 4px;
      font-size: clamp(11px, 3.5vw, 14px);
      border: none;
      border-radius: 9px;
      background: #fff;
      color: #111;
      font-weight: bold;
      touch-action: manipulation;
    }

    #controls button:active {
      background: #b9e4d5;
    }

    #resetBtn {
      background: #ffdddd !important;
    }

    #startHint {
      position: fixed;
      bottom: 184px;
      left: 10px;
      right: 10px;
      text-align: center;
      color: white;
      font-size: 13px;
      z-index: 5;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="info">
    AR Cadaver Visualization<br />
    Move your phone to detect a surface, then tap to place the model.
  </div>

  <div id="startHint">
    Rotation controls work after the model is placed.
  </div>

  <div id="controls">
    <button id="leftBtn">↶ Left</button>
    <button id="rightBtn">↷ Right</button>
    <button id="upBtn">↑ Tilt</button>
    <button id="downBtn">↓ Tilt</button>
    <button id="resetRotationBtn">Reset Rotation</button>
    <button id="resetBtn">Remove Model</button>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { ARButton } from "three/addons/webxr/ARButton.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    let camera, scene, renderer;
    let controller;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let modelPlaced = false;

    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.08, 0.11, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0x00ff88 })
    );

    reticle.matrixAutoUpdate = false;
    reticle.visible = false;

    // Everything in this group moves together.
    const modelGroup = new THREE.Group();
    modelGroup.visible = false;

    // Keep the original model rotation separate from user rotation.
    const modelOrientation = new THREE.Group();
    modelGroup.add(modelOrientation);

    let cadaver = null;
    let originalRotation = new THREE.Euler(0, 0, 0);

    init();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        20
      );

      scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));

      const light = new THREE.DirectionalLight(0xffffff, 2);
      light.position.set(1, 4, 2);
      scene.add(light);

      scene.add(reticle);
      scene.add(modelGroup);

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      });

      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      document.body.appendChild(renderer.domElement);

      const arButton = ARButton.createButton(renderer, {
        requiredFeatures: ["hit-test"],
        optionalFeatures: ["dom-overlay"],
        domOverlay: { root: document.body }
      });

      document.body.appendChild(arButton);

      // Load the anatomical model.
      const loader = new GLTFLoader();

      loader.load(
        "./models/cadaver.glb",

        function (gltf) {
          cadaver = gltf.scene;

          // Center the model around its own bounding box.
          let box = new THREE.Box3().setFromObject(cadaver);
          const size = new THREE.Vector3();
          const center = new THREE.Vector3();

          box.getSize(size);
          box.getCenter(center);

          cadaver.position.sub(center);

          // Fit the model to approximately 1.7 metres tall.
          // If the source model is lying down, this scaling uses
          // its longest dimension as the intended standing height.
          const maxDimension = Math.max(size.x, size.y, size.z);

          if (maxDimension > 0) {
            const scale = 1.7 / maxDimension;
            cadaver.scale.setScalar(scale);
          }

          // IMPORTANT:
          // Change this rotation if the model is still upside down.
          // These are starting values; GLB files use different axes.
          cadaver.rotation.set(0, 0, 0);

          modelOrientation.add(cadaver);

          // Place the model's lowest point at ground level.
          box = new THREE.Box3().setFromObject(cadaver);
          cadaver.position.y -= box.min.y;

          // Save this orientation for the Reset Rotation button.
          originalRotation.copy(cadaver.rotation);

          document.getElementById("startHint").textContent =
            "Model loaded. Place it on a detected surface.";

          console.log("Cadaver model loaded successfully.");
        },

        undefined,

        function (error) {
          console.error("Could not load models/cadaver.glb:", error);

          document.getElementById("startHint").textContent =
            "Model failed to load. Check the GLB file path.";
        }
      );

      controller = renderer.xr.getController(0);
      controller.addEventListener("select", onSelect);
      scene.add(controller);

      // Rotation controls.
      document.getElementById("leftBtn").addEventListener("click", () => {
        if (modelPlaced) modelGroup.rotation.y -= Math.PI / 12;
      });

      document.getElementById("rightBtn").addEventListener("click", () => {
        if (modelPlaced) modelGroup.rotation.y += Math.PI / 12;
      });

      document.getElementById("upBtn").addEventListener("click", () => {
        if (modelPlaced) modelOrientation.rotation.x -= Math.PI / 12;
      });

      document.getElementById("downBtn").addEventListener("click", () => {
        if (modelPlaced) modelOrientation.rotation.x += Math.PI / 12;
      });

      document.getElementById("resetRotationBtn").addEventListener("click", () => {
        modelGroup.rotation.set(0, 0, 0);
        modelOrientation.rotation.set(0, 0, 0);

        if (cadaver) {
          cadaver.rotation.copy(originalRotation);
        }
      });

      document.getElementById("resetBtn").addEventListener("click", () => {
        modelGroup.visible = false;
        modelPlaced = false;

        document.getElementById("startHint").textContent =
          "Move your phone to detect a surface, then tap to place the model.";
      });

      window.addEventListener("resize", onWindowResize);

      renderer.setAnimationLoop(render);
    }

    function onSelect() {
      if (!reticle.visible || !cadaver) return;

      // Place the model at the detected surface.
      modelGroup.position.setFromMatrixPosition(reticle.matrix);

      // Align its vertical direction with the detected surface normal.
      modelGroup.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        new THREE.Vector3(0, 1, 0)
      );

      modelGroup.visible = true;
      modelPlaced = true;

      document.getElementById("startHint").textContent =
        "Use the buttons below to rotate the model.";
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function render(timestamp, frame) {
      if (frame) {
        const session = renderer.xr.getSession();
        const referenceSpace = renderer.xr.getReferenceSpace();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace("viewer").then((viewerSpace) => {
            session.requestHitTestSource({ space: viewerSpace })
              .then((source) => {
                hitTestSource = source;
              })
              .catch((error) => {
                console.error("Hit test unavailable:", error);
              });
          });

          hitTestSourceRequested = true;

          session.addEventListener("end", () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
            reticle.visible = false;
          });
        }

        if (hitTestSource) {
          const results = frame.getHitTestResults(hitTestSource);

          if (results.length > 0) {
            const hit = results[0];
            const pose = hit.getPose(referenceSpace);

            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
